<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lidar 2D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="panel" aria-label="Painel de controle">
    <h1>Lidar 2D</h1>

    <div class="statusbar" aria-live="polite">
      <div class="statusline">
        <span id="st-state" class="pill" data-state="disconnected">desconectado</span>
        <span id="status" class="status" data-state="connecting" title="Conexão com o servidor"><i class="dot"></i><span id="status-text">conectando…</span></span>
      </div>
      <div class="metrics"><span>FPS <b id="fps">0.0</b></span><span><b id="points">0</b> pontos/volta</span></div>
    </div>

    <section>
      <h2>Conexão</h2>
      <div class="row head">
        <label for="port">Porta serial</label>
        <button id="btn-refresh" type="button" title="Atualizar lista de portas" aria-label="Atualizar lista de portas">↻</button>
      </div>
      <select id="port" class="wide"></select>
      <p id="port-desc" class="port-desc" aria-live="polite"></p>
      <!-- Um passo de cada vez: só o botão do próximo passo aparece (o JS esconde os outros). -->
      <div id="actions" class="actions">
        <button id="btn-connect" type="button" class="primary big">Conectar</button>
        <button id="btn-start" type="button" class="primary big">Iniciar varredura</button>
        <button id="btn-stop" type="button" class="danger big">Parar varredura</button>
        <button id="btn-disconnect" type="button" class="linkbtn">Desconectar</button>
      </div>
    </section>

    <div id="error" class="error" role="alert" hidden></div>

    <section>
      <h2>LiDAR</h2>
      <div class="row head">
        <label for="rot-hz">Velocidade de giro</label>
        <b id="rot-label" class="value">—</b>
      </div>
      <input id="rot-hz" type="range" min="8" max="12" step="0.5" value="10" class="wide" list="rot-marks" disabled>
      <datalist id="rot-marks"><option value="8"></option><option value="10"></option><option value="12"></option></datalist>
      <div class="ticks" aria-hidden="true"><span id="rot-min">8</span><span id="rot-mid">10</span><span id="rot-max">12 Hz</span></div>
      <div class="row head">
        <p id="rot-note" class="port-desc">Esta fonte não permite mudar a velocidade de giro.</p>
        <button id="rot-reset" type="button" class="small" disabled title="Volta para 10 Hz (600 rpm), o padrão do C1">Padrão</button>
      </div>
    </section>

    <section>
      <h2>Exibição</h2>
      <label for="range">Alcance dos eixos (±m)</label>
      <div class="row">
        <input id="range" type="number" min="1" max="12" step="0.5" value="6" inputmode="decimal">
        <button id="btn-range" type="button">Aplicar</button>
      </div>
      <label class="toggle"><input type="checkbox" id="color-q" class="switch" checked> Colorir por qualidade</label>
    </section>

    <details class="device">
      <summary>Dispositivo <span id="st-health" class="health">—</span></summary>
      <dl class="facts">
        <dt>Modelo</dt><dd id="st-model">—</dd>
        <dt>Firmware</dt><dd id="st-firmware">—</dd>
        <dt>Nº de série</dt><dd id="st-serial">—</dd>
        <dt>Pacotes inválidos</dt><dd id="st-errors">0</dd>
      </dl>
    </details>
  </aside>

  <main id="plot"></main>
</div>

<!-- Plotly local (bundle gl2d 2.35.2, MIT): sem CDN -->
<script src="vendor/plotly-gl2d.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
